name: ci
on: [push, pull_request]
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
      - run: uv run --locked pytest
        env:
          UV_PYTHON: ${{ matrix.python }}

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
      - run: uv run --locked python -I scripts/check_version.py
        env:
          PRE_COMMIT_FROM_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
          PRE_COMMIT_TO_REF: ${{ github.sha }}
      - run: uv run --locked python -I scripts/check_uv_pins.py
      - run: uv run --locked prek run --all-files
        env:
          PREK_SKIP: version
      - run: uv run --locked pyright
      - run: uv run --locked zizmor --offline .github
